[package]
name = "actix"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
sea-orm = { version = "1.1.19", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
] }
sea-orm-migration = "1.1.19"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
actix-rt = "2.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
jsonwebtoken = { version = "10", features = ["rust_crypto"] } # or the latest
futures = "0.3.31"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
validator = { version = "0.20.0", features = ["derive"] }
bcrypt = "0.18.0"
chrono = { version = "0.4.42", features = ["serde"] } # ← must be here!
env_logger = "0.11.8" # or latest
log = "0.4.29"
openssl = { version = "0.10.75", features = ["vendored"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "app"
path = "src/main.rs"
