[package]
name = "actix"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
sea-orm = { version = "1.1.13", features = ["sqlx-postgres", "runtime-tokio-native-tls"]}
sea-orm-migration = "1.1.13"
tokio = { version = "1.46.1", features = ["full"]}
actix-rt = "2.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"

[[bin]]
name = "migration-bin"  # <-- renamed to avoid conflict
path = "migration/main.rs"

[[bin]]
name = "main"
path = "src/main.rs"
