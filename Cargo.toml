[package]
name = "actix"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
sea-orm = { version = "1.1.16", features = ["sqlx-postgres", "runtime-tokio-native-tls"]}
sea-orm-migration = "1.1.16"
tokio = { version = "1.46.1", features = ["full"]}
actix-rt = "2.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
jsonwebtoken = "9"   # or the latest
futures = "0.3.31"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
dotenvy = "0.15.7"
validator = { version = "0.20.0", features = ["derive"] }
bcrypt = "0.17.0"
chrono = { version = "0.4.41", features = ["serde"] }  # ← must be here!
env_logger = "0.11.8"         # or latest
log = "0.4.27"
openssl = { version = "0.10.73", features = ["vendored"] }

[[bin]]
name = "migration-bin"  # <-- renamed to avoid conflict
path = "migration/main.rs"

[[bin]]
name = "app"
path = "src/main.rs"
