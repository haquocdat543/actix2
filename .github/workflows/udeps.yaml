name: Unused dependency check
on:
  push:
  pull_request:

permissions:
  issues: write
  checks: write

env:
  TOOLCHAIN_VERSION: nightly-2025-01-01
  COMPONENTS: rustfmt, clippy

jobs:
  udeps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/bin
            ~/.cargo/binstall
            ~/.cargo/git
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.TOOLCHAIN_VERSION }}
          components: ${{ env.COMPONENTS }}

      - name: Run cargo-udeps
        uses: aig787/cargo-udeps-action@v1
        with:
          version: "latest"
          args: "--all-targets"
