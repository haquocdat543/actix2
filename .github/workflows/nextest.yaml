name: Nextest check

on:
  pull_request:
  push:

permissions:
  issues: write
  checks: write

jobs:
  nextest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            ~/.cargo/bin
            ~/.cargo/binstall
            ~/.cargo/git
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-

      - name: Nextest
        run: cargo nextest run
